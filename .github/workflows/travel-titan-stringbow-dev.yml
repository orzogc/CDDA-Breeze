name: Travel Titan Stringbow Dev Patch

on:
  push:
    branches:
      - feature/travel-meaning-titan-stringbow
    paths:
      - .github/workflows/travel-titan-stringbow-dev.yml

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/travel-meaning-titan-stringbow
          fetch-depth: 0
      - name: Apply travel mod patch
        run: python3 tools/dev_travel_titan_patch.py
      - name: Validate whitespace
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src data/mods/旅行的意义
          git commit -m "旅行的意义：重制泰坦弦弓与来生酒吧标签"
          git push origin HEAD:feature/travel-meaning-titan-stringbow
